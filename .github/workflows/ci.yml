name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # The corpus job below is the only check that can tell a drifted engine from
  # a current one, and it can start failing without a single commit here: the
  # SPEC moves, the embedded wasm does not, and a push-triggered run reports
  # the state of the day someone last touched this repo. This repository sat
  # green for two days while 36 of 610 corpus documents rendered wrongly,
  # because nothing had pushed since the drift began.
  #
  # This one GATES rather than reports. A corpus divergence is not upstream
  # being ahead, it is this artifact rendering documents wrongly today.
  schedule:
    - cron: "35 6 * * *"
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version: ['1.25.x', 'stable']
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...

  # The embedded wasm is a prebuilt artifact, so it can fall behind the spec
  # without any change in this repository. Run the mandatory corpus through it
  # so that drift fails a build instead of waiting to be noticed.
  corpus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check out the spec corpus
        uses: actions/checkout@v7
        with:
          repository: markup-carve/carve
          path: spec

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: stable

      # NO -run FILTER. This step used to run `go test -run TestSpecCorpus`,
      # and corpus_ast_test.go's two AST checks matched neither half of that
      # pattern - so with the variable unset they skipped, and with it set they
      # were filtered out. There was no configuration in which they ran
      # (markup-carve/carve-go#29). Running the whole package with the variable
      # set means a corpus-gated test added later is covered without anyone
      # remembering to widen a pattern; TestTheCorpusJobRunsEveryCorpusGatedTest
      # fails the build if a filter is ever reintroduced too narrow.
      - name: Corpus
        env:
          CARVE_SPEC_CORPUS: ${{ github.workspace }}/spec/tests/corpus
        run: go test -v ./...

  # The embedded wasm is a committed binary, so nothing in a diff says which
  # engine it is. internal/wasm/REV records that, and internal/wasm/carve.wasm.sha256
  # records what the bytes beside it hash to - both written by build-wasm.sh in
  # the same step that produces them.
  #
  # This used to be an inline script here, and it was the only pin measurement
  # in the org, which is why the shared reader in carve-rs is generalized from
  # it. Calling that reader instead of keeping a sixth copy of the rule is the
  # point: the rule lives in one place and every binding inherits it.
  #
  # Two deliberate changes from the inline version it replaces:
  #
  #  - the lag no longer emits `::warning::`. A warning annotation cannot fail a
  #    job, and this repository is the proof that that is not enough: it carried
  #    a lag warning throughout and was still the binding furthest behind, with
  #    a green scheduled run. The lag is now printed as a plain number and
  #    `--max-age-days` gates on AGE instead. Age rather than commit count,
  #    because carve-rs merges continuously: a count-based gate is red from the
  #    moment any PR opens there and unclearable by the action it recommends,
  #    whereas a pin older than N days is cleared by rebuilding.
  #
  #  - an abbreviated or upper-case revision is now refused rather than
  #    accepted. It resolves locally and then matches nothing.
  #
  # --artifact/--artifact-digest is what makes REV describe the binary rather
  # than merely accompany it. The guard makes that assertion ONLY when a digest
  # is supplied, because asserting the pairing without one would be a check that
  # cannot fail - see build-wasm.sh for what the digest does and does not buy.
  engine-rev:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # fetch-depth: 0 is required. The guard runs `merge-base --is-ancestor`
      # against main, which needs the history to be there.
      - name: Check out carve-rs
        uses: actions/checkout@v7
        with:
          repository: markup-carve/carve-rs
          path: carve-rs
          fetch-depth: 0

      # --max-age-days 14: this repository has rebuilt the embedded wasm every
      # one to two days since it started recording REV, so fourteen is several
      # times the observed cadence - wide enough that a quiet fortnight is not a
      # false alarm, tight enough to catch the state this repository was
      # actually in when the class was filed.
      - name: Check the recorded engine revision
        run: |
          python3 carve-rs/tools/check-engine-pin.py \
            --engine carve-rs --github --max-age-days 14 \
            --form rev-file --file internal/wasm/REV \
            --artifact internal/wasm/carve.wasm \
            --artifact-digest internal/wasm/carve.wasm.sha256
