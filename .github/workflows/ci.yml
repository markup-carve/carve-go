name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version: ['1.25.x', 'stable']
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...

  # The embedded wasm is a prebuilt artifact, so it can fall behind the spec
  # without any change in this repository. Run the mandatory corpus through it
  # so that drift fails a build instead of waiting to be noticed.
  corpus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check out the spec corpus
        uses: actions/checkout@v4
        with:
          repository: markup-carve/carve
          path: spec

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Corpus
        env:
          CARVE_SPEC_CORPUS: ${{ github.workspace }}/spec/tests/corpus
        run: go test -run TestSpecCorpus -v ./...

  # The embedded wasm is a committed binary, so nothing in a diff says which
  # engine it is. internal/wasm/REV records that, written by build-wasm.sh in
  # the same step that produces the bytes. This job makes the record legible:
  # it fails when the revision is not a real commit on carve-rs main (a typo, a
  # local-only build, a force-pushed branch), and it reports the lag behind main
  # as a warning rather than a failure - carve-rs merging something is not a
  # defect in this repository, and the corpus job above is what says whether the
  # lag has started to matter.
  engine-rev:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check out carve-rs
        uses: actions/checkout@v4
        with:
          repository: markup-carve/carve-rs
          path: carve-rs
          fetch-depth: 0

      - name: Check the recorded engine revision
        run: |
          set -euo pipefail
          if [ ! -f internal/wasm/REV ]; then
            echo "::error::internal/wasm/REV is missing; run ./build-wasm.sh to record which carve-rs the embedded wasm came from"
            exit 1
          fi
          rev="$(tr -d '[:space:]' < internal/wasm/REV)"
          if ! git -C carve-rs cat-file -e "${rev}^{commit}" 2>/dev/null; then
            echo "::error::internal/wasm/REV names ${rev}, which is not a commit in carve-rs"
            exit 1
          fi
          if ! git -C carve-rs merge-base --is-ancestor "${rev}" origin/main; then
            echo "::error::carve-rs ${rev} is not on main, so the embedded engine came from an unmerged or rewritten branch"
            exit 1
          fi
          behind="$(git -C carve-rs rev-list --count "${rev}..origin/main")"
          echo "embedded engine: carve-rs ${rev} ($(git -C carve-rs log -1 --format=%s "${rev}"))"
          echo "carve-rs main is ${behind} commit(s) ahead"
          if [ "${behind}" -gt 0 ]; then
            echo "::warning::the embedded wasm is ${behind} carve-rs commit(s) behind main; run ./build-wasm.sh to refresh it"
          fi
