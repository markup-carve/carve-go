name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  engine-pin:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Check out carve-rs
        uses: actions/checkout@v7
        with:
          repository: markup-carve/carve-rs
          ref: main
          path: carve-rs-main
          fetch-depth: 0

      - name: Check the pinned WASI artifact and its source commit
        run: |
          (cd internal/wasm && sha256sum -c carve.wasm.sha256)
          rev="$(cat internal/wasm/REV)"
          [[ "$rev" =~ ^[0-9a-f]{40}$ ]]
          git -C carve-rs-main cat-file -e "$rev^{commit}"
          git -C carve-rs-main merge-base --is-ancestor "$rev" HEAD

  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        go-version: ['1.25.x', 'stable']
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...
